<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone, carte en révision</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background-color:#fde9d6}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #fde9d6 0%, #fcdcbd 55%, #f9cda4 100%); color: #2a1a10; font-family: 'Geist', system-ui, sans-serif;">

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3;">
  <sc-for list="{{falling}}" as="f" hint-placeholder-count="3">
    <span class="{{f.cls}}" style="position: absolute; top: 0; display: block; opacity: 0; left: {{f.left}}%; animation-delay: {{f.delay}}s;">
      <sc-if value="{{f.isA}}" hint-placeholder-val="{{ true }}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 10 10" shape-rendering="crispEdges" style="display: block;"><path fill="{{f.body}}" d="M7 0h2v1h-2zM5 1h4v1h-4zM4 2h5v1h-5zM3 3h6v1h-6zM2 4h6v1h-6zM2 5h5v1h-5zM1 6h5v1h-5zM1 7h3v1h-3z"></path><path fill="{{f.vein}}" d="M2 6h1v1h-1zM3 5h1v1h-1zM4 4h1v1h-1zM5 3h1v1h-1zM6 2h1v1h-1zM7 1h1v1h-1z"></path><path fill="#7a3d14" d="M1 8h1v1h-1zM0 9h1v1h-1z"></path></svg></sc-if>
      <sc-if value="{{f.isB}}" hint-placeholder-val="{{ false }}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 11 11" shape-rendering="crispEdges" style="display: block;"><path fill="{{f.body}}" d="M5 0h1v1h-1zM4 1h3v1h-3zM1 2h1v1h-1zM4 2h3v1h-3zM9 2h1v1h-1zM1 3h2v1h-2zM4 3h3v1h-3zM8 3h2v1h-2zM1 4h9v1h-9zM0 5h11v1h-11zM1 6h9v1h-9zM2 7h7v1h-7zM3 8h5v1h-5z"></path><path fill="{{f.vein}}" d="M5 1h1v8h-1zM3 5h2v1h-2zM6 5h2v1h-2z"></path><path fill="#7a3d14" d="M5 9h1v2h-1z"></path></svg></sc-if>
    </span>
  </sc-for>
</div>

<div style="position: relative; z-index: 1; height: 100%; padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 14px;">
  <header style="display: flex; align-items: center; gap: 8px;">
    <a href="MobileCartes.dc.html" class="btn btn-ghost" aria-label="Quitter la file" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid #efd5bc; background-color: #fffaf3; color: #2a1a10;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </a>
    <div style="flex: 1; min-width: 0; text-align: center;">
      <p style="margin: 0; font-size: 15px; font-weight: 600;">File du jour</p>
      <p style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 12px; color: #6b4a35;">{{counter}}</p>
    </div>
    <button type="button" class="btn btn-ghost" onClick="{{toggleFall}}" aria-pressed="{{fallOn}}" aria-label="Feuilles qui tombent" title="{{fallTitle}}" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid #efd5bc; background-color: #fffaf3;">
      <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{fallLeaf}}" d="M7 0h2v1h-2zM5 1h4v1h-4zM4 2h5v1h-5zM3 3h6v1h-6zM2 4h6v1h-6zM2 5h5v1h-5zM1 6h5v1h-5zM1 7h3v1h-3z"></path><path fill="{{fallVein}}" d="M2 6h1v1h-1zM3 5h1v1h-1zM4 4h1v1h-1zM5 3h1v1h-1zM6 2h1v1h-1zM7 1h1v1h-1z"></path><path fill="#7a3d14" d="M1 8h1v1h-1zM0 9h1v1h-1z"></path></svg>
      <sc-if value="{{fallOff}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 9px; top: 20px; width: 24px; height: 2px; border-radius: 2px; background-color: #6b4a35; transform: rotate(-45deg);"></span></sc-if>
    </button>
  </header>

  <div style="display: flex; align-items: center; gap: 10px;">
    <div aria-hidden="true" class="pxs" style="flex: 1; padding: 2px; background-color: #bb4d00;">
      <div class="pxs" style="display: flex; gap: 2px; padding: 3px 4px; background-color: #fffaf3;">
        <sc-for list="{{progress}}" as="g" hint-placeholder-count="20"><span style="flex: 1; height: 10px; transition: background-color .3s; background-color: {{g}};"></span></sc-for>
      </div>
    </div>
    <span style="padding: 4px 10px; border-radius: 999px; background-color: #2a1a10; color: #fbba72; font-family: 'Doto', monospace; font-weight: 900; font-size: 14px; white-space: nowrap;">+{{pts}} pts</span>
  </div>

  <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="position: relative; flex: 1; min-height: 0; padding-top: 10px;">
      <div aria-hidden="true" style="position: absolute; left: 16px; right: 16px; top: 0; height: 50px; border-radius: 22px; background-color: #f6dcc0; border: 1px solid #ebc8a6; transform: rotate(-1.5deg);"></div>
      <div aria-hidden="true" style="position: absolute; left: 8px; right: 8px; top: 5px; height: 50px; border-radius: 22px; background-color: #fbe9d7; border: 1px solid #efd5bc; transform: rotate(1deg);"></div>
      <section aria-labelledby="t-front" style="position: relative; height: 100%; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; background-color: #fffaf3; border: 1px solid #efd5bc; border-radius: 22px; box-shadow: 0 22px 40px -28px rgba(120,60,20,0.5);">
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <span style="padding: 3px 10px; border-radius: 999px; background-color: #fbe9d7; font-size: 12px; color: #4d3324;">{{card.where}}</span>
          <span style="padding: 3px 10px; border-radius: 999px; background-color: #2a1a10; color: #fbba72; font-size: 12px;">Palier : {{card.tier}}</span>
        </div>
        <h1 id="t-front" style="margin: 0; font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em;">{{card.front}}</h1>
        <sc-if value="{{shown}}" hint-placeholder-val="{{ true }}">
          <div class="reveal" style="display: flex; flex-direction: column; gap: 16px;">
            <div aria-hidden="true" style="height: 3px; background-image: repeating-linear-gradient(90deg, #e3c3a5 0 8px, transparent 8px 14px);"></div>
            <p style="margin: 0; font-size: 17px; line-height: 1.55;">{{card.back}}</p>
          </div>
        </sc-if>
      </section>
      <sc-if value="{{justRated}}" hint-placeholder-val="{{ false }}">
        <span class="floatup" aria-live="polite" style="position: absolute; right: 16px; top: -4px; padding: 3px 10px; border-radius: 999px; background-color: #276a3f; color: #fffaf5; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500;">+3 pts</span>
      </sc-if>
    </div>

    <sc-if value="{{hidden}}" hint-placeholder-val="{{ false }}">
      <button type="button" class="btn btn-primary" onClick="{{reveal}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px; border: 0; border-radius: 999px; background-color: #bb4d00; color: #fffaf5; font-size: 17px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path></svg>
        Retourner la carte
      </button>
    </sc-if>
    <sc-if value="{{shown}}" hint-placeholder-val="{{ true }}">
      <div>
        <p style="margin: 0 0 8px; font-size: 13px; font-weight: 500; color: #6b4a35; text-align: center;">Tu la connaissais ?</p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <button type="button" class="btn" onClick="{{rate}}" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; border-radius: 16px; border: 1.5px solid #8f250c; background-color: #fbe3da; color: #8f250c;">
            <span style="font-size: 15px; font-weight: 600;">À revoir</span>
            <span style="font-size: 12px;">{{card.again}}</span>
          </button>
          <button type="button" class="btn" onClick="{{rate}}" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; border-radius: 16px; border: 1.5px solid #2a1a10; background-color: #2a1a10; color: #fbe9d7;">
            <span style="font-size: 15px; font-weight: 600;">Bien</span>
            <span style="font-size: 12px; color: #e8cdb4;">{{card.good}}</span>
          </button>
          <button type="button" class="btn btn-primary" onClick="{{rate}}" style="min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; border-radius: 16px; border: 1.5px solid #bb4d00; background-color: #bb4d00; color: #fffaf5;">
            <span style="font-size: 15px; font-weight: 600;">Facile</span>
            <span style="font-size: 12px; color: #fffaf5;">{{card.easy}}</span>
          </button>
        </div>
      </div>
    </sc-if>
  </div>
  </sc-if>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <section class="popin" aria-labelledby="t-done" style="flex: 1; padding: 28px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; background-color: #fffaf3; border: 1px solid #efd5bc; border-radius: 22px;">
      <div style="padding: 8px; border-radius: 14px; background-color: #2a1a10;">
        <div style="padding: 6px 14px 4px; border-radius: 9px; background-color: #fbba72; color: #691e06; font-family: 'Doto', monospace; font-weight: 900; font-size: 48px; line-height: 1;">37/37</div>
      </div>
      <h1 id="t-done" style="margin: 0; font-size: 24px; font-weight: 600;">File du jour terminée</h1>
      <p style="margin: 0; font-size: 15px; color: #6b4a35;">+111 pts. Prochaines cartes demain.</p>
      <a href="MobileCartes.dc.html" class="btn btn-primary" style="margin-top: 6px; padding: 14px 24px; border-radius: 999px; background-color: #bb4d00; color: #fffaf5; font-size: 16px; font-weight: 600; text-decoration: none;">Retour à l’accueil</a>
    </section>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"feuilles":{"editor":"boolean","default":true,"section":"Ambiance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    try { if (window.localStorage.getItem("bachotage-feuilles") === "off") this.setState({ noFall: true }); } catch (e) {}
  }
  renderVals() {
    const st = this.state || {};
    const feuilles = this.props.feuilles ?? true;
    const idx = st.idx ?? 0;
    const revealed = st.revealed ?? true;
    const rated = st.rated ?? 0;

    const LEAF = { orange: ["#e8742a", "#bb4d00"], caramel: ["#fbba72", "#e08a3c"], gold: ["#f2a541", "#c46f12"], bronze: ["#ca5310", "#8f250c"] };
    const fallRaw = [["A", 20, "orange", 25, 4, "fallA"], ["B", 22, "gold", 72, 14, "fallB"], ["A", 18, "caramel", 50, 24, "fallA"]];
    const falling = feuilles && !st.noFall ? fallRaw.map((f) => ({ isA: f[0] === "A", isB: f[0] === "B", size: f[1], body: LEAF[f[2]][0], vein: LEAF[f[2]][1], left: f[3], delay: f[4], cls: f[5] })) : [];

    const when = (d) => (d === 1 ? "demain" : "dans " + d + " j");
    const CARDS = [
      { where: "Biochimie, Enzymologie", tier: "1 jour", front: "Que représente le Km d’une enzyme ?", back: "La concentration en substrat pour laquelle la vitesse vaut Vmax/2. Plus le Km est faible, plus l’affinité apparente est forte.", next: [1, 3, 7] },
      { where: "Physiologie, Respiration", tier: "3 jours", front: "Principal stimulus de la ventilation chez le sujet sain ?", back: "L’augmentation de la PaCO2, détectée surtout par les chémorécepteurs centraux du bulbe.", next: [1, 7, 14] },
      { where: "Biochimie, Lipides", tier: "7 jours", front: "Qu’est-ce qu’un acide gras essentiel ?", back: "Un acide gras que l’organisme ne sait pas synthétiser et que l’alimentation doit apporter, comme l’acide linoléique.", next: [1, 14, 14] }
    ];
    const done = idx >= CARDS.length;
    const c = CARDS[Math.min(idx, CARDS.length - 1)];
    const seen = 34 + Math.min(idx, CARDS.length);
    const lit = Math.round((seen / 37) * 20);

    return {
      falling,
      fallOn: !st.noFall,
      fallOff: !!st.noFall,
      fallTitle: st.noFall ? "Activer les feuilles qui tombent" : "Couper les feuilles qui tombent",
      fallLeaf: st.noFall ? "#d9bfa6" : "#e8742a",
      fallVein: st.noFall ? "#b39580" : "#bb4d00",
      toggleFall: () => { const next = !st.noFall; try { window.localStorage.setItem("bachotage-feuilles", next ? "off" : "on"); } catch (e) {} this.setState({ noFall: next }); },
      progress: Array.from({ length: 20 }, (_, i) => (i < lit ? "#bb4d00" : "rgba(187,77,0,0.08)")),
      pts: 102 + rated * 3,
      counter: done ? "37 sur 37" : "Carte " + (35 + idx) + " sur 37",
      card: { where: c.where, tier: c.tier, front: c.front, back: c.back, again: when(c.next[0]), good: when(c.next[1]), easy: when(c.next[2]) },
      done,
      notDone: !done,
      hidden: !done && !revealed,
      shown: !done && revealed,
      justRated: rated > 0 && !revealed && !done,
      reveal: () => this.setState({ revealed: true }),
      rate: () => this.setState({ idx: idx + 1, revealed: false, rated: rated + 1 })
    };
  }
}
</script>
</body>
</html>
