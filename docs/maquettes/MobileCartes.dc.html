<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Téléphone, flashcards</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Doto:wght@700;900&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background-color:#fde9d6}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: linear-gradient(180deg, #fde9d6 0%, #fcdcbd 55%, #f9cda4 100%); color: #2a1a10; font-family: 'Geist', system-ui, sans-serif;">

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 0;">
  <sc-for list="{{decor}}" as="l" hint-placeholder-count="4">
    <span class="{{l.cls}}" style="position: absolute; display: block; {{l.pos}}">
      <sc-if value="{{l.isA}}" hint-placeholder-val="{{ true }}"><svg width="{{l.size}}" height="{{l.size}}" viewBox="0 0 10 10" shape-rendering="crispEdges" style="display: block; transform: rotate({{l.rot}}deg);"><path fill="{{l.body}}" d="M7 0h2v1h-2zM5 1h4v1h-4zM4 2h5v1h-5zM3 3h6v1h-6zM2 4h6v1h-6zM2 5h5v1h-5zM1 6h5v1h-5zM1 7h3v1h-3z"></path><path fill="{{l.vein}}" d="M2 6h1v1h-1zM3 5h1v1h-1zM4 4h1v1h-1zM5 3h1v1h-1zM6 2h1v1h-1zM7 1h1v1h-1z"></path><path fill="#7a3d14" d="M1 8h1v1h-1zM0 9h1v1h-1z"></path></svg></sc-if>
      <sc-if value="{{l.isB}}" hint-placeholder-val="{{ false }}"><svg width="{{l.size}}" height="{{l.size}}" viewBox="0 0 11 11" shape-rendering="crispEdges" style="display: block; transform: rotate({{l.rot}}deg);"><path fill="{{l.body}}" d="M5 0h1v1h-1zM4 1h3v1h-3zM1 2h1v1h-1zM4 2h3v1h-3zM9 2h1v1h-1zM1 3h2v1h-2zM4 3h3v1h-3zM8 3h2v1h-2zM1 4h9v1h-9zM0 5h11v1h-11zM1 6h9v1h-9zM2 7h7v1h-7zM3 8h5v1h-5z"></path><path fill="{{l.vein}}" d="M5 1h1v8h-1zM3 5h2v1h-2zM6 5h2v1h-2z"></path><path fill="#7a3d14" d="M5 9h1v2h-1z"></path></svg></sc-if>
    </span>
  </sc-for>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3;">
  <sc-for list="{{falling}}" as="f" hint-placeholder-count="3">
    <span class="{{f.cls}}" style="position: absolute; top: 0; display: block; opacity: 0; left: {{f.left}}%; animation-delay: {{f.delay}}s;">
      <sc-if value="{{f.isA}}" hint-placeholder-val="{{ true }}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 10 10" shape-rendering="crispEdges" style="display: block;"><path fill="{{f.body}}" d="M7 0h2v1h-2zM5 1h4v1h-4zM4 2h5v1h-5zM3 3h6v1h-6zM2 4h6v1h-6zM2 5h5v1h-5zM1 6h5v1h-5zM1 7h3v1h-3z"></path><path fill="{{f.vein}}" d="M2 6h1v1h-1zM3 5h1v1h-1zM4 4h1v1h-1zM5 3h1v1h-1zM6 2h1v1h-1zM7 1h1v1h-1z"></path><path fill="#7a3d14" d="M1 8h1v1h-1zM0 9h1v1h-1z"></path></svg></sc-if>
      <sc-if value="{{f.isB}}" hint-placeholder-val="{{ false }}"><svg width="{{f.size}}" height="{{f.size}}" viewBox="0 0 11 11" shape-rendering="crispEdges" style="display: block;"><path fill="{{f.body}}" d="M5 0h1v1h-1zM4 1h3v1h-3zM1 2h1v1h-1zM4 2h3v1h-3zM9 2h1v1h-1zM1 3h2v1h-2zM4 3h3v1h-3zM8 3h2v1h-2zM1 4h9v1h-9zM0 5h11v1h-11zM1 6h9v1h-9zM2 7h7v1h-7zM3 8h5v1h-5z"></path><path fill="{{f.vein}}" d="M5 1h1v8h-1zM3 5h2v1h-2zM6 5h2v1h-2z"></path><path fill="#7a3d14" d="M5 9h1v2h-1z"></path></svg></sc-if>
    </span>
  </sc-for>
</div>

<div style="position: relative; z-index: 1; height: 100%; overflow-y: auto; padding: 14px 18px 24px; display: flex; flex-direction: column; gap: 16px;">
  <header style="display: flex; align-items: center; gap: 10px;">
    <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#bb4d00"></circle><circle cx="14" cy="14" r="8" fill="none" stroke="#fbba72" stroke-width="1.5"></circle><circle cx="14" cy="14" r="3" fill="#fffaf3"></circle></svg>
    <span style="font-size: 17px; font-weight: 600;">Bachotage</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
      <button type="button" class="btn btn-ghost" onClick="{{toggleFall}}" aria-pressed="{{fallOn}}" aria-label="Feuilles qui tombent" title="{{fallTitle}}" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1px solid #efd5bc; background-color: #fffaf3;">
        <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{fallLeaf}}" d="M7 0h2v1h-2zM5 1h4v1h-4zM4 2h5v1h-5zM3 3h6v1h-6zM2 4h6v1h-6zM2 5h5v1h-5zM1 6h5v1h-5zM1 7h3v1h-3z"></path><path fill="{{fallVein}}" d="M2 6h1v1h-1zM3 5h1v1h-1zM4 4h1v1h-1zM5 3h1v1h-1zM6 2h1v1h-1zM7 1h1v1h-1z"></path><path fill="#7a3d14" d="M1 8h1v1h-1zM0 9h1v1h-1z"></path></svg>
        <sc-if value="{{fallOff}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 9px; top: 20px; width: 24px; height: 2px; border-radius: 2px; background-color: #6b4a35; transform: rotate(-45deg);"></span></sc-if>
      </button>
      <span aria-hidden="true" style="width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; background-color: #fbba72; color: #691e06; font-size: 14px; font-weight: 600;">NA</span>
    </div>
  </header>

  <div class="rise">
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em;">Salut nathan</h1>
    <p style="margin: 4px 0 0; font-size: 15px; color: #6b4a35;">Mardi 10 novembre</p>
  </div>

  <section class="rise" aria-labelledby="t-due" style="animation-delay: 80ms; padding: 16px; display: flex; flex-direction: column; gap: 14px; background-color: #2a1a10; color: #fbe9d7; border-radius: 22px; box-shadow: 0 18px 36px -24px rgba(60,25,5,0.7);">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h2 id="t-due" style="margin: 0; font-size: 14px; font-weight: 500; color: #e8cdb4;">À revoir aujourd’hui</h2>
      <span lang="ja" style="font-family: 'DotGothic16', sans-serif; font-size: 11px; letter-spacing: 0.18em; color: #c9a88e;">カード</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 10px 16px; border-radius: 12px; background-color: #fbba72; color: #691e06; box-shadow: inset 0 0 0 1px rgba(105,30,6,0.18), inset 0 3px 0 rgba(105,30,6,0.1);">
      <div style="position: relative; font-family: 'Doto', monospace; font-weight: 900; font-size: 76px; line-height: 0.9;">
        <span aria-hidden="true" style="position: absolute; left: 0; top: 0; opacity: 0.12;">88</span>
        <span style="position: relative;">{{due}}</span>
      </div>
      <div style="text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 500; line-height: 1.6;">
        <div>CARTES</div>
        <div>12 MIN</div>
        <div>+111 PTS</div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px;">
      <span style="padding: 4px 10px; border-radius: 999px; background-color: #3d2819; font-size: 13px; color: #f1dcc6;">Biochimie 14</span>
      <span style="padding: 4px 10px; border-radius: 999px; background-color: #3d2819; font-size: 13px; color: #f1dcc6;">Physiologie 10</span>
      <span style="padding: 4px 10px; border-radius: 999px; background-color: #3d2819; font-size: 13px; color: #f1dcc6;">Autres 13</span>
    </div>
    <a href="MobileCarte.dc.html" class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 20px; border-radius: 999px; background-color: #bb4d00; color: #fffaf5; font-size: 17px; font-weight: 600; text-decoration: none;">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"></path></svg>
      Lancer la file
    </a>
  </section>

  <section class="rise" aria-labelledby="t-new" style="animation-delay: 160ms; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <h2 id="t-new" style="margin: 0; font-size: 18px; font-weight: 600;">Nouvelles cartes</h2>
      <span style="font-size: 13px; color: #6b4a35;">3 pts par carte</span>
    </div>
    <div style="display: flex; flex-direction: column; overflow: hidden; background-color: rgba(255,250,243,0.94); border: 1px solid #efd5bc; border-radius: 18px;">
      <sc-for list="{{fresh}}" as="c" hint-placeholder-count="4">
        <a href="MobileCarte.dc.html" class="row" style="min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-decoration: none; color: #2a1a10; {{c.sep}}">
          <span style="flex: 1; min-width: 0;">
            <span style="display: block; font-size: 15px; font-weight: 600;">{{c.name}}</span>
            <span style="display: block; margin-top: 1px; font-size: 13px; color: #6b4a35;">{{c.subject}}</span>
          </span>
          <span style="padding: 3px 9px; border-radius: 999px; background-color: #fbe9d7; font-family: 'Geist Mono', monospace; font-size: 12px; color: #4d3324;">{{c.count}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b4a35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </sc-for>
    </div>
  </section>

  <div class="rise" style="animation-delay: 220ms; display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background-color: rgba(253,227,200,0.85); border: 1px solid #f1cfa9;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9a3f00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px;"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M1 20h22"></path></svg>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #4d3324;">QCM, exercices, classement et profil sont sur ordinateur.</p>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"feuilles":{"editor":"boolean","default":true,"section":"Ambiance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    try { if (window.localStorage.getItem("bachotage-feuilles") === "off") this.setState({ noFall: true }); } catch (e) {}
    const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) return;
    const start = Date.now();
    this.setState({ k: 0 });
    this._t = setInterval(() => {
      const k = Math.min(1, (Date.now() - start) / 1200);
      this.setState({ k });
      if (k >= 1) clearInterval(this._t);
    }, 40);
  }
  componentWillUnmount() {
    clearInterval(this._t);
  }
  renderVals() {
    const st = this.state || {};
    const feuilles = this.props.feuilles ?? true;
    const k = st.k ?? 1;
    const ease = 1 - Math.pow(1 - k, 3);

    const LEAF = { orange: ["#e8742a", "#bb4d00"], caramel: ["#fbba72", "#e08a3c"], gold: ["#f2a541", "#c46f12"], bronze: ["#ca5310", "#8f250c"] };
    const decorRaw = [
      ["B", 56, "orange", 18, "top: 70px; right: -10px;", true],
      ["A", 34, "gold", -40, "top: 130px; right: 46px;", true],
      ["B", 50, "caramel", -20, "bottom: -14px; right: 20px;", false],
      ["A", 36, "orange", 60, "bottom: 10px; left: -6px;", true]
    ];
    const decor = feuilles ? decorRaw.map((l) => ({ isA: l[0] === "A", isB: l[0] === "B", size: l[1], body: LEAF[l[2]][0], vein: LEAF[l[2]][1], rot: l[3], pos: l[4], cls: l[5] ? "sway" : "" })) : [];
    const fallRaw = [["A", 20, "orange", 20, 3, "fallA"], ["B", 22, "gold", 70, 13, "fallB"], ["A", 18, "caramel", 45, 22, "fallA"]];
    const falling = feuilles && !st.noFall ? fallRaw.map((f) => ({ isA: f[0] === "A", isB: f[0] === "B", size: f[1], body: LEAF[f[2]][0], vein: LEAF[f[2]][1], left: f[3], delay: f[4], cls: f[5] })) : [];

    const fresh = [
      ["Métabolisme énergétique", "Biochimie", "20 nouvelles"],
      ["Cycle de Krebs", "Biochimie", "16 nouvelles"],
      ["Mort cellulaire", "Biologie cellulaire", "16 nouvelles"],
      ["Génétique des populations", "Génétique", "14 nouvelles"]
    ].map((r, i) => ({ name: r[0], subject: r[1], count: r[2], sep: i === 0 ? "" : "border-top: 1px solid #f3e0cc;" }));

    return {
      decor,
      falling,
      fallOn: !st.noFall,
      fallOff: !!st.noFall,
      fallTitle: st.noFall ? "Activer les feuilles qui tombent" : "Couper les feuilles qui tombent",
      fallLeaf: st.noFall ? "#d9bfa6" : "#e8742a",
      fallVein: st.noFall ? "#b39580" : "#bb4d00",
      toggleFall: () => { const next = !st.noFall; try { window.localStorage.setItem("bachotage-feuilles", next ? "off" : "on"); } catch (e) {} this.setState({ noFall: next }); },
      due: String(Math.round(37 * ease)).padStart(2, "0"),
      fresh
    };
  }
}
</script>
</body>
</html>
